<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil Pengguna</title>
    <link rel="stylesheet" href="src/outputail.css">
    
    <style>
        /* Style untuk input disabled agar terlihat solid */
        input:disabled,
        textarea:disabled {
            background-color: #f8fafc; /* bg-slate-50 */
            color: #333;
            border-color: #d1d5db;
            cursor: default;
            -webkit-text-fill-color: #333;
            opacity: 1;
        }

        /* Style untuk input yang error */
        .input-error {
            border-color: #ef4444; /* border-red-500 */
            background-color: #fee2e2; /* bg-red-50 */
        }
        .input-error:focus {
            border-color: #ef4444; /* focus:border-red-500 */
            ring-color: #ef4444; /* focus:ring-red-500 */
        }
    </style>
</head>
<body class="bg-slate-100 font-sans p-8">

    <a href="#" class="inline-block bg-white text-gray-800 font-semibold py-2 px-6 rounded-lg shadow-md hover:bg-gray-50 transition mb-6">
        &larr; Kembali
    </a>

    <div class="max-w-6xl mx-auto bg-white p-8 md:p-12 rounded-lg shadow-xl">
        
        <h1 class="text-3xl font-bold text-slate-800 mb-8">Informasi Tentang Anda</h1>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-12">
            
            <div class="lg:col-span-1 space-y-6 flex flex-col items-center lg:items-start">
                
                <div class="flex flex-col items-center w-full">
                    <label class="text-lg font-semibold text-gray-700 mb-2">Avatar</label>
                    <div id="avatar-container" class="relative transition-all duration-300">
                        <input type="file" id="avatar-upload" class="hidden" accept="image/png, image/jpeg" />
                        <img id="avatar-preview" src="https://i.ibb.co/6nL1Y0N/image-ac433a.png" alt="Avatar" class="w-36 h-36 rounded-full object-cover border-4 border-slate-200">
                    </div>
                    <p id="avatar-error" class="text-red-600 text-sm mt-2 h-4"></p> <button type="button" id="ganti-profile-btn" class="mt-4 w-full max-w-xs bg-slate-700 text-white font-bold py-2 px-6 rounded-md hover:bg-slate-800 transition">
                        Ganti Profile
                    </button>

                    <div id="avatar-actions" class="hidden w-full max-w-xs space-y-2 mt-4">
                        <button type="button" id="simpan-avatar-btn" class="w-full bg-green-600 text-white font-bold py-2 px-6 rounded-md hover:bg-green-700 transition">
                            Simpan Avatar
                        </button>
                        <button type="button" id="batal-avatar-btn" class="w-full bg-gray-500 text-white font-bold py-2 px-6 rounded-md hover:bg-gray-600 transition">
                            Batal
                        </button>
                    </div>
                </div>
                
                <div class="w-full pt-6 border-t border-slate-200 lg:mt-auto">
                     <button type="button" id="logout-btn" class="w-full max-w-xs bg-red-600 text-white font-bold py-2 px-6 rounded-md hover:bg-red-700 transition flex items-center justify-center gap-2">
                        Logout
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="lg:col-span-2">
                
                <form id="info-form" novalidate>
                    <h2 class="text-2xl font-semibold text-slate-700 mb-6">Informasi Akun</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-2">
                        
                        <div>
                            <label for="username" class="text-sm font-medium text-gray-600">Username</label>
                            <input type="text" id="username" data-info-field value="Fakhri" disabled class="mt-1 w-full p-2 border rounded-md transition focus:ring-2 focus:ring-[#A03D37] focus:border-[#A03D37]">
                            <p id="username-error" class="text-red-600 text-sm mt-1 h-4"></p>
                        </div>
                        
                        <div>
                            <label for="email" class="text-sm font-medium text-gray-600">Email</label>
                            <input type="email" id="email" data-info-field value="cruherogaming@gmail.co" disabled class="mt-1 w-full p-2 border rounded-md transition focus:ring-2 focus:ring-[#A03D37] focus:border-[#A03D37]">
                            <p id="email-error" class="text-red-600 text-sm mt-1 h-4"></p>
                        </div>

                        <div class="md:col-span-2">
                            <label for="nama-lengkap" class="text-sm font-medium text-gray-600">Nama lengkap</label>
                            <input type="text" id="nama-lengkap" data-info-field value="Ishigami Senku" disabled class="mt-1 w-full p-2 border rounded-md transition focus:ring-2 focus:ring-[#A03D37] focus:border-[#A03D37]">
                            <p id="nama-lengkap-error" class="text-red-600 text-sm mt-1 h-4"></p>
                        </div>

                        <div>
                            <label for="no-telp" class="text-sm font-medium text-gray-600">No. Telp</label>
                            <input type="text" inputmode="tel" id="no-telp" data-info-field value="10000000000" disabled class="mt-1 w-full p-2 border rounded-md transition focus:ring-2 focus:ring-[#A03D37] focus:border-[#A03D37]">
                            <p id="no-telp-error" class="text-red-600 text-sm mt-1 h-4"></p>
                        </div>

                        <div>
                            <label for="provinsi" class="text-sm font-medium text-gray-600">Provinsi</label>
                            <input type="text" id="provinsi" data-info-field value="Kinki" disabled class="mt-1 w-full p-2 border rounded-md transition focus:ring-2 focus:ring-[#A03D37] focus:border-[#A03D37]">
                            <p id="provinsi-error" class="text-red-600 text-sm mt-1 h-4"></p>
                        </div>

                        <div>
                            <label for="kota" class="text-sm font-medium text-gray-600">Kota</label>
                            <input type="text" id="kota" data-info-field value="Kyoto" disabled class="mt-1 w-full p-2 border rounded-md transition focus:ring-2 focus:ring-[#A03D37] focus:border-[#A03D37]">
                            <p id="kota-error" class="text-red-600 text-sm mt-1 h-4"></p>
                        </div>

                        <div class="md:col-span-2">
                            <label for="alamat" class="text-sm font-medium text-gray-600">Alamat</label>
                            <textarea id="alamat" data-info-field rows="3" disabled class="mt-1 w-full p-2 border rounded-md transition focus:ring-2 focus:ring-[#A03D37] focus:border-[#A03D37]">Jl. Isekai nomer 3700</textarea>
                            <p id="alamat-error" class="text-red-600 text-sm mt-1 h-4"></p>
                        </div>
                    </div>
                    
                    <div class="flex justify-end pt-6">
                        <button id="toggle-info-btn" type="button" class="bg-[#8B4513] text-white font-bold py-2 px-10 rounded-md hover:bg-opacity-90 transition-all">
                            Ubah Informasi
                        </button>
                    </div>
                </form>

                <hr class="my-10 border-slate-200">

                <form id="password-form" novalidate>
                    <h2 class="text-2xl font-semibold text-slate-700 mb-6">Ubah Password</h2>
                    <div class="space-y-4 max-w-md">
                        
                        <div>
                            <label for="sandi-lama" class="text-sm font-medium text-gray-600">Password Lama</label>
                            <div class="relative mt-1">
                                <input type="password" id="sandi-lama" placeholder="Masukkan sandi saat ini" class="mt-1 w-full p-2 border rounded-md transition focus:ring-2 focus:ring-[#A03D37] focus:border-[#A03D37]">
                                <button type="button" class="toggle-password-vis absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600">
                                    <svg class="eye-icon h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                                    <svg class="eye-slash-icon h-5 w-5 hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.243 4.243l-4.243-4.243" /></svg>
                                </button>
                            </div>
                            <p id="sandi-lama-error" class="text-red-600 text-sm mt-1 h-4"></p>
                        </div>
                        
                        <div>
                            <label for="sandi-baru" class="text-sm font-medium text-gray-600">Password Baru</label>
                            <div class="relative mt-1">
                                <input type="password" id="sandi-baru" placeholder="Minimal 6 karakter" class="mt-1 w-full p-2 border rounded-md transition focus:ring-2 focus:ring-[#A03D37] focus:border-[#A03D37]">
                                <button type="button" class="toggle-password-vis absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600">
                                    <svg class="eye-icon h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                                    <svg class="eye-slash-icon h-5 w-5 hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.243 4.243l-4.243-4.243" /></svg>
                                </button>
                            </div>
                            <p id="sandi-baru-error" class="text-red-600 text-sm mt-1 h-4"></p>
                        </div>

                        <div>
                            <label for="konfirmasi-sandi" class="text-sm font-medium text-gray-600">Konfirmasi Password Baru</label>
                            <div class="relative mt-1">
                                <input type="password" id="konfirmasi-sandi" placeholder="Ulangi sandi baru" class="mt-1 w-full p-2 border rounded-md transition focus:ring-2 focus:ring-[#A03D37] focus:border-[#A03D37]">
                                <button type="button" class="toggle-password-vis absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600">
                                    <svg class="eye-icon h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                                    <svg class="eye-slash-icon h-5 w-5 hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.243 4.243l-4.243-4.243" /></svg>
                                </button>
                            </div>
                            <p id="konfirmasi-sandi-error" class="text-red-600 text-sm mt-1 h-4"></p>
                        </div>

                    </div>
                    
                    <div class="flex justify-end pt-6">
                        <button id="submit-password-btn" type="submit" disabled class="bg-[#8B4513] text-white font-bold py-2 px-10 rounded-md hover:bg-opacity-90 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                            Ubah Password
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // === 1. PILIH SEMUA ELEMEN ===
        
        // --- Form Informasi ---
        const infoForm = document.getElementById('info-form');
        const toggleInfoBtn = document.getElementById('toggle-info-btn');
        const allInfoInputs = document.querySelectorAll('[data-info-field]');
        const usernameInput = document.getElementById('username');
        const emailInput = document.getElementById('email');
        const namaLengkapInput = document.getElementById('nama-lengkap');
        const noTelpInput = document.getElementById('no-telp');
        const provinsiInput = document.getElementById('provinsi');
        const kotaInput = document.getElementById('kota');
        const alamatInput = document.getElementById('alamat');

        // --- Form Password ---
        const passwordForm = document.getElementById('password-form');
        const submitPasswordBtn = document.getElementById('submit-password-btn');
        const sandiLamaInput = document.getElementById('sandi-lama');
        const sandiBaruInput = document.getElementById('sandi-baru');
        const konfirmasiSandiInput = document.getElementById('konfirmasi-sandi');
        const passwordToggles = document.querySelectorAll('.toggle-password-vis');

        // --- Avatar (Selektor BARU ditambahkan) ---
        const gantiProfileBtn = document.getElementById('ganti-profile-btn');
        const avatarUpload = document.getElementById('avatar-upload');
        const avatarPreview = document.getElementById('avatar-preview');
        const avatarError = document.getElementById('avatar-error');
        const avatarActions = document.getElementById('avatar-actions');
        const simpanAvatarBtn = document.getElementById('simpan-avatar-btn');
        const batalAvatarBtn = document.getElementById('batal-avatar-btn');

        // === Variabel State ===
        let isInfoEditMode = false;
        let newAvatarFile = null; // Menyimpan file avatar baru sementara
        const originalAvatarSrc = avatarPreview.src; // Menyimpan URL gambar asli

        
        // Definisikan Regex untuk validasi
        const REGEX = {
            email: /^[^\s@]+@[^\s@]+\.[^\s@]+$/,
            username: /^[a-zA-Z0-9_\\.]{3,20}$/,
            nama: /^[a-zA-Z\s]+$/, 
            telp: /^\d{10,13}$/,
        };


        // === 2. FUNGSI HELPER VALIDASI (Show/Clear Error) ===

        function showError(inputId, message) {
            const inputElement = document.getElementById(inputId);
            const errorElement = document.getElementById(inputId + '-error');
            
            if (inputElement) inputElement.classList.add('input-error');
            if (errorElement) {
                errorElement.textContent = message;
            }
        }

        function clearError(inputId) {
            const inputElement = document.getElementById(inputId);
            const errorElement = document.getElementById(inputId + '-error');
            
            if (inputElement) inputElement.classList.remove('input-error');
            if (errorElement) {
                errorElement.textContent = '';
            }
        }

        // === 3. LOGIKA FORM INFORMASI ===

        function toggleInfoEditMode(enable) {
            isInfoEditMode = enable;
            allInfoInputs.forEach(input => {
                input.disabled = !enable;
                input.classList.toggle('bg-slate-50', !enable);
                input.classList.toggle('bg-white', enable);
                if (!enable) {
                    clearError(input.id);
                }
            });
            toggleInfoBtn.textContent = enable ? 'Simpan Informasi' : 'Ubah Informasi';
            toggleInfoBtn.type = enable ? 'submit' : 'button';
        }

        // --- Fungsi Validasi Individual (Form Info) ---
        function validateUsername() {
            clearError('username');
            const value = usernameInput.value.trim();
            if (value.length === 0) {
                showError('username', 'Username tidak boleh kosong.'); return false;
            }
            if (!REGEX.username.test(value)) {
                showError('username', 'Min 3 char, hanya huruf, angka, _ dan .'); return false;
            }
            return true;
        }

        function validateEmail() {
            clearError('email');
            const value = emailInput.value.trim();
            if (value.length === 0) {
                showError('email', 'Email tidak boleh kosong.'); return false;
            }
            if (!REGEX.email.test(value)) {
                showError('email', 'Format email tidak valid (contoh: user@mail.com).'); return false;
            }
            return true;
        }

        function validateNama(inputId, fieldName) {
            clearError(inputId);
            const input = document.getElementById(inputId);
            const value = input.value.trim();
            if (value.length === 0) {
                showError(inputId, `${fieldName} tidak boleh kosong.`); return false;
            }
            if (!REGEX.nama.test(value)) {
                showError(inputId, `${fieldName} hanya boleh berisi huruf dan spasi.`); return false;
            }
            return true;
        }

        function validateNoTelp() {
            clearError('no-telp');
            const value = noTelpInput.value.trim();
            if (value.length === 0) {
                showError('no-telp', 'No. telp tidak boleh kosong.'); return false;
            }
            if (!REGEX.telp.test(value)) {
                showError('no-telp', 'No. telp harus 10-13 digit angka.'); return false;
            }
            return true;
        }
        
        function validateRequired(inputId) {
            clearError(inputId);
            const input = document.getElementById(inputId);
            if (input.value.trim().length === 0) {
                showError(inputId, 'Field ini tidak boleh kosong.'); return false;
            }
            return true;
        }

        // --- Event Listeners Form Info ---
        toggleInfoBtn.addEventListener('click', (event) => {
            if (!isInfoEditMode) {
                event.preventDefault(); 
                toggleInfoEditMode(true);
            }
        });
        
        // Validasi 'on blur' (saat keluar field) HANYA jika mode edit
        usernameInput.addEventListener('blur', () => isInfoEditMode && validateUsername());
        emailInput.addEventListener('blur', () => isInfoEditMode && validateEmail());
        namaLengkapInput.addEventListener('blur', () => isInfoEditMode && validateNama('nama-lengkap', 'Nama lengkap'));
        noTelpInput.addEventListener('blur', () => isInfoEditMode && validateNoTelp());
        provinsiInput.addEventListener('blur', () => isInfoEditMode && validateNama('provinsi', 'Provinsi'));
        kotaInput.addEventListener('blur', () => isInfoEditMode && validateNama('kota', 'Kota'));
        alamatInput.addEventListener('blur', () => isInfoEditMode && validateRequired('alamat'));

        // [DIPERBAIKI] Fungsi untuk membatasi input (hanya huruf dan spasi)
        const restrictToLetters = (e) => {
            if (isInfoEditMode) {
                e.target.value = e.target.value.replace(/[^a-zA-Z\s]/g, '');
            }
        };

        // Terapkan pembatas input ke Provinsi, Kota, dan Nama
        provinsiInput.addEventListener('input', restrictToLetters);
        kotaInput.addEventListener('input', restrictToLetters);
        namaLengkapInput.addEventListener('input', restrictToLetters);

        // Terapkan pembatas input ke No Telp (hanya angka)
        noTelpInput.addEventListener('input', (e) => {
            if (isInfoEditMode) e.target.value = e.target.value.replace(/[^0-9]/g, '');
        });

        // Submit Form Info
        infoForm.addEventListener('submit', (event) => {
            event.preventDefault(); 
            
            const isValid = [
                validateUsername(),
                validateEmail(),
                validateNama('nama-lengkap', 'Nama lengkap'),
                validateNoTelp(),
                validateNama('provinsi', 'Provinsi'),
                validateNama('kota', 'Kota'),
                validateRequired('alamat')
            ].every(Boolean); // Cek jika semua hasil validasi adalah true

            if (isValid) {
                console.log('Form Informasi Valid. Mengirim data...');
                // TODO: Kirim data form info ke server di sini
                alert('Informasi Anda berhasil diperbarui!');
                toggleInfoEditMode(false); 
            } else {
                console.log('Form Informasi Tidak Valid.');
                alert('Terdapat error pada data Anda. Mohon periksa kembali.');
            }
        });


        // === 4. LOGIKA FORM PASSWORD ===

        // [DIPERBAIKI] Validasi password disederhanakan
        function validatePasswordRealtime() {
            let isValid = true;
            const oldPass = sandiLamaInput.value;
            const newPass = sandiBaruInput.value;
            const confirmPass = konfirmasiSandiInput.value;
            
            clearError('sandi-lama');
            clearError('sandi-baru');
            clearError('konfirmasi-sandi');

            const isChangingPassword = oldPass.length > 0 || newPass.length > 0 || confirmPass.length > 0;
            if (!isChangingPassword) {
                submitPasswordBtn.disabled = true;
                return false;
            }
            
            if (oldPass.length === 0) {
                showError('sandi-lama', 'Password lama wajib diisi.');
                isValid = false;
            }
            if (newPass.length === 0) {
                 showError('sandi-baru', 'Password baru wajib diisi.');
                 isValid = false;
            } else if (newPass.length < 6) { // Cek minimal 6 karakter
                showError('sandi-baru', 'Password baru minimal 6 karakter.');
                isValid = false;
            }
            if (confirmPass.length === 0) {
                showError('konfirmasi-sandi', 'Konfirmasi password wajib diisi.');
                isValid = false;
            } else if (newPass !== confirmPass) { // Cek konfirmasi harus cocok
                showError('konfirmasi-sandi', 'Password tidak cocok.');
                isValid = false;
            }
            
            submitPasswordBtn.disabled = !isValid;
            return isValid;
        }

        sandiLamaInput.addEventListener('input', validatePasswordRealtime);
        sandiBaruInput.addEventListener('input', validatePasswordRealtime);
        konfirmasiSandiInput.addEventListener('input', validatePasswordRealtime);

        passwordForm.addEventListener('submit', (event) => {
            event.preventDefault();
            
            if (validatePasswordRealtime()) {
                console.log('Form Password Valid. Mengirim data...');
                // TODO: Kirim data password ke server di sini
                alert('Password Anda berhasil diubah!');
                passwordForm.reset(); 
                submitPasswordBtn.disabled = true;
                clearError('sandi-lama');
                clearError('sandi-baru');
                clearError('konfirmasi-sandi');
            } else {
                console.log('Form Password Tidak Valid.');
            }
        });

        passwordToggles.forEach(toggle => {
            toggle.addEventListener('click', () => {
                const wrapper = toggle.parentElement;
                const input = wrapper.querySelector('input');
                const eyeIcon = wrapper.querySelector('.eye-icon');
                const eyeSlashIcon = wrapper.querySelector('.eye-slash-icon');
                if (input.type === 'password') {
                    input.type = 'text';
                    eyeIcon.classList.add('hidden');
                    eyeSlashIcon.classList.remove('hidden');
                } else {
                    input.type = 'password';
                    eyeIcon.classList.remove('hidden');
                    eyeSlashIcon.classList.add('hidden');
                }
            });
        });


        // === 5. LOGIKA AVATAR (TERPISAH) ===
        
        function validateAvatar(file) {
            clearError('avatar');
            if (!file) return true; 

            const ALLOWED_TYPES = ['image/jpeg', 'image/png'];
            const MAX_SIZE = 2 * 1024 * 1024; // 2 MB

            if (!ALLOWED_TYPES.includes(file.type)) {
                showError('avatar', 'Tipe file tidak valid. Hanya PNG atau JPEG.'); return false;
            }
            if (file.size > MAX_SIZE) {
                showError('avatar', 'Ukuran file terlalu besar. Maksimal 2 MB.'); return false;
            }
            return true;
        }

        // Tombol 'Ganti Profile' ditekan
        gantiProfileBtn.addEventListener('click', () => {
            avatarUpload.click(); 
        });

        // Pengguna memilih file baru
        avatarUpload.addEventListener('change', (event) => {
            const files = event.target.files;
            if (files && files[0]) {
                if (validateAvatar(files[0])) { 
                    newAvatarFile = files[0]; 
                    
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        avatarPreview.src = e.target.result; 
                    }
                    reader.readAsDataURL(newAvatarFile);
                    
                    // Tampilkan tombol 'Simpan' & 'Batal', sembunyikan 'Ganti'
                    avatarActions.classList.remove('hidden');
                    gantiProfileBtn.classList.add('hidden');
                    
                } else {
                    avatarUpload.value = ''; 
                    newAvatarFile = null;
                }
            }
        });

        // Tombol 'Simpan Avatar' ditekan
        simpanAvatarBtn.addEventListener('click', () => {
            if (newAvatarFile) {
                console.log('Mengunggah avatar:', newAvatarFile.name);
                
                // TODO: Tambahkan kode fetch() di sini untuk upload file
                // const formData = new FormData();
                // formData.append('avatar', newAvatarFile);
                // fetch('/api/upload-avatar', { method: 'POST', body: formData })
                //   .then(response => response.json())
                //   .then(data => {
                //      console.log('Upload sukses:', data);
                //      alert('Avatar berhasil disimpan!');
                //   })
                //   .catch(error => {
                //      console.error('Upload gagal:', error);
                //      alert('Upload avatar gagal.');
                //   });

                // Simulasi sukses untuk testing:
                alert('Avatar berhasil disimpan! (Simulasi)');
                
                // Reset state
                newAvatarFile = null;
                avatarUpload.value = '';
                avatarActions.classList.add('hidden');
                gantiProfileBtn.classList.remove('hidden');
                clearError('avatar');
            }
        });

        // Tombol 'Batal' ditekan
        batalAvatarBtn.addEventListener('click', () => {
            newAvatarFile = null;
            avatarUpload.value = '';
            avatarActions.classList.add('hidden');
            gantiProfileBtn.classList.remove('hidden');
            avatarPreview.src = originalAvatarSrc; // Kembalikan ke gambar asli
            clearError('avatar');
        });


        // === 6. INISIALISASI HALAMAN ===
        toggleInfoEditMode(false); // Kunci form info saat dimuat
        submitPasswordBtn.disabled = true; // Nonaktifkan tombol password
    });
    </script>
